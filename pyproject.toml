[project]
name = "mercadoboy"
version = "0.1.0"
description = "POC agente IA sobre Mercado Público: core de integración y conector MCP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "tenacity>=8.2",
    "mcp>=1.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "respx>=0.21",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = ["integration: usa la API real y consume cupo (correr a mano, de noche)"]

[tool.coverage.run]
source = ["mp_core"]
